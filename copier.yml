_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/context.py:GitInfoExtension

# TEMPLATE QUESTIONS

project_name:
  type: str
  help: Human-readable project name
  default: "{{ current_folder_name | default('My Project', true) | replace('_', ' ') | replace('-', ' ') | title }}"
  validator: >-
    {%- if not project_name -%}
    Error: Project name cannot be empty.
    {%- elif '"' in project_name or '\n' in project_name -%}
    Error: Project name cannot contain double quotes or newlines.
    {%- endif -%}

author_name:
  type: str
  help: Author name
  default: "{{ git_user_name | default('Your Name', true) }}"
  validator: >-
    {%- if not author_name -%}
    Error: Author name cannot be empty.
    {%- elif '"' in author_name or '\n' in author_name -%}
    Error: Author name cannot contain double quotes or newlines.
    {%- endif -%}

author_email:
  type: str
  help: Author email
  default: >-
    {%- set email = git_user_email | default('your@email.com', true) -%}
    {{- email if '@' in email and '.' in email else 'your@email.com' -}}
  validator: >-
    {%- if "@" not in author_email or "." not in author_email -%}
    Error: Please enter a valid email address (must contain @ and .).
    {%- elif '"' in author_email or ' ' in author_email or '\n' in author_email -%}
    Error: Email cannot contain spaces, quotes, or newlines.
    {%- endif -%}

description:
  type: str
  help: Short project description
  default: A React frontend application.
  validator: >-
    {%- if '"' in description or '\n' in description -%}
    Error: Description cannot contain double quotes or newlines (use single quotes instead).
    {%- endif -%}

node_version:
  type: str
  help: Which version of Node.js are you using?
  default: "24"
  choices:
    - "24"
    - "22"
    - "20"

backend_url:
  type: str
  help: Default local backend URL (used in env.js and openapi-ts config)
  default: "http://localhost:8000"
  validator: >-
    {%- if not (backend_url.startswith('http://') or backend_url.startswith('https://')) -%}
    Error: The backend URL must start with http:// or https://
    {%- elif '"' in backend_url or ' ' in backend_url or '\n' in backend_url -%}
    Error: The URL cannot contain spaces, double quotes, or newlines.
    {%- endif -%}

use_oidc:
  type: bool
  default: true
  help: Do you want to protect the App with OIDC Authentication?

oidc_provider:
  type: str
  default: Local Keycloak
  choices:
    Local Keycloak: Local Keycloak
    External IdP (Okta, Auth0, Azure AD, Cognito, etc.): External IdP
  help: Select your OIDC provider strategy.
  when: "{{ use_oidc }}"

oidc_client_id:
  type: str
  default: my-react-spa
  help: OIDC client/application ID (for example, Okta app client ID).
  when: "{{ use_oidc and oidc_provider == 'External IdP' }}"
  validator: >-
    {%- if not oidc_client_id -%}
    Error: Client ID cannot be empty.
    {%- elif '"' in oidc_client_id or ' ' in oidc_client_id or '\n' in oidc_client_id -%}
    Error: Client ID cannot contain spaces, double quotes, or newlines.
    {%- endif -%}

oidc_authority:
  type: str
  default: https://your-idp.com/oauth2/default
  help: OIDC issuer/authority URL (for example, Okta/Auth0/Azure AD).
  when: "{{ use_oidc and oidc_provider == 'External IdP' }}"
  validator: >-
    {%- if not (oidc_authority.startswith('http://') or oidc_authority.startswith('https://')) -%}
    Error: The authority must be a valid URL starting with http:// or https://
    {%- elif '"' in oidc_authority or ' ' in oidc_authority or '\n' in oidc_authority -%}
    Error: The URL cannot contain spaces, double quotes, or newlines.
    {%- endif -%}

add_ci:
  type: bool
  default: true
  help: Configure CI pipeline?

ci_provider:
  type: str
  default: github
  choices:
    Github Actions: github
    GitLab CI: gitlab
    Bitbucket Pipelines: bitbucket
  help: Which CI provider are you using?
  when: "{{ add_ci }}"

install_dependencies:
  type: bool
  default: true
  help: Run npm install after generation?


# POST-GENERATION TASKS

_tasks:
  - command: "npm install"
    when: "{{ install_dependencies }}"

  - command: "npm run lint:fix || true"
    when: "{{ install_dependencies }}"

  - command: "npm run format || true"
    when: "{{ install_dependencies }}"

  - command: |
      if [ ! -d .git ]; then
          git init
      fi

      if ! git ls-files .copier-answers.yml --error-unmatch > /dev/null 2>&1; then
          git add .
          git commit --no-verify -m "chore: initial commit from template"
      fi

_subdirectory: template
